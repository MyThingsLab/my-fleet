name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here (#52): a stacked PR (base != main) still needs
  # to produce the `test` check main's branch protection requires, or it can
  # never satisfy it regardless of how good the code is. `push` above stays
  # scoped to main -- that's the only ref where a push-triggered run matters.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Supersede in-flight runs when an agent pushes again to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip while a PR is a draft; always run on pushes to main.
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            HEAD="HEAD"
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -vE '(\.md$|^docs/|^dev-ledger/)' || true)
          if [ -n "$CHANGED" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/dev-ledger changed; skipping build and test steps."
          fi
      # This repo's only real deps beyond my-things-core are sibling repos
      # from the same owner (not on PyPI): the orchestrator, the merge guard,
      # the Telegram transport used by the ASK channel, the tool-chaining
      # graph fleet_cycle ticks, and the worker CLI fleet_dispatch shells out
      # to. my-guard is v1 and pinned per RELEASE.md; my-orchestrator,
      # my-telegram-bot, my-pipeline, and my-coder are v0 and float on @main.
      #
      # my-things-core is v1 too, so RELEASE.md wants an exact tag here — but
      # there is no tag to pin to. Core's pyproject is at 1.2.0 while its only
      # tag is v1.0.0, and its CHANGELOG carries two different [1.2.0] entries
      # (605cda5 added mythings.session, then 89a3340 reranked
      # labels.sort_key without bumping), so no tag names the code we need.
      # @main is the deliberate stopgap: v1.0.0 predates mythings.labels, which
      # my-orchestrator@main imports, so pinning it red-lines this repo.
      # Restore the pin once core tags a release.
      - name: Install
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          pip install "my-things-core @ git+https://github.com/${{ github.repository_owner }}/my-things-core@main"
          # --no-deps: its only dep is the core installed above, but its main
          # still names it "mythings-core" (pre-rename) which pip can't resolve.
          pip install --no-deps "my-orchestrator @ git+https://github.com/${{ github.repository_owner }}/my-orchestrator@main"
          # merge_ready_prs.py routes every merge through MyGuard's pr-merge ASK
          # rule, so the guard is a real dependency of this repo's scripts now.
          pip install --no-deps "my-guard @ git+https://github.com/${{ github.repository_owner }}/my-guard@v1.0.0"
          # notify_usage.py / notify_systemd_status.py import mytelegrambot.transport;
          # --no-deps for the same pre-rename-metadata reason as my-orchestrator.
          pip install --no-deps "my-telegram-bot @ git+https://github.com/${{ github.repository_owner }}/my-telegram-bot@main"
          # fleet_cycle imports mypipeline.plan.build_plan to drive the cycle off
          # my-pipeline's declarative tool-chaining graph.
          pip install --no-deps "my-pipeline @ git+https://github.com/${{ github.repository_owner }}/my-pipeline@main"
          # fleet_dispatch.py shells out to the `mycoder` CLI as the worker
          # role instead of spawning its own inline session.
          pip install --no-deps "my-coder @ git+https://github.com/${{ github.repository_owner }}/my-coder@main"
          pip install -e ".[dev]"
      - name: Ruff
        if: steps.changes.outputs.code_changed == 'true'
        run: ruff check src tests
      # test_integration_reporter.py is deliberately absent: it needs sibling
      # checkouts (run locally via fleet_test.py --include-slow).
      - name: Tests
        if: steps.changes.outputs.code_changed == 'true'
        run: pytest tests --ignore=tests/test_integration_reporter.py
